# Unbreakable-app achter BunkerWeb (WAF + HTTPS via Let's Encrypt).
#
# Verkeer:  internet -> bunkerweb (poort 80/443) -> app (intern, poort 8080) -> db
#           internet -> bunkerweb -> /auth/realms/, /auth/resources/ -> keycloak -> keycloak-db
#           app -> openfga -> openfga-db   (enkel intern: BunkerWeb kan OpenFGA niet bereiken)
# De app publiceert zelf GEEN poorten meer: enkel de WAF is van buiten bereikbaar.
# Keycloak publiceert enkel 127.0.0.1:8081 voor de admin console (via een SSH-tunnel).
# OpenFGA publiceert niets.
#
# Let op: bunkerweb en bw-scheduler moeten EXACT dezelfde versie draaien.
#
# Het e-mailadres voor Let's Encrypt komt uit een bestand .env naast dit bestand
# (LE_EMAIL=jouw@adres). Dat bestand zet je NIET in de repo.
# Ook KC_ADMIN_USER, KC_ADMIN_PASSWORD, KC_DB_PASSWORD, FGA_DB_PASSWORD en FGA_API_TOKEN
# komen uit .env (de pipeline schrijft ze weg uit GitHub Secrets).

services:
  # --- De WAF zelf: NGINX + ModSecurity + OWASP Core Rule Set -----------------
  bunkerweb:
    image: bunkerity/bunkerweb:1.6.10
    container_name: bunkerweb
    ports:
      - "80:8080/tcp"     # HTTP  (nodig voor de Let's Encrypt-controle)
      - "443:8443/tcp"    # HTTPS
    environment:
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
    restart: unless-stopped
    networks:
      - bw-universe
      - bw-services

  # --- De scheduler: leest de instellingen, haalt certificaten op ---------------
  bw-scheduler:
    image: bunkerity/bunkerweb-scheduler:1.6.10
    container_name: bw-scheduler
    depends_on:
      - bunkerweb
    volumes:
      - bw-storage:/data   # hier bewaart BunkerWeb o.a. je certificaten: NIET wissen!
    environment:
      BUNKERWEB_INSTANCES: "bunkerweb"
      SERVER_NAME: "g01.ipv6.thelastgym.be"
      MULTISITE: "yes"
      API_WHITELIST_IP: "127.0.0.0/8 10.20.30.0/24"
      SERVE_FILES: "no"
      DISABLE_DEFAULT_SERVER: "yes"   # verzoeken met een andere hostnaam/IP worden geweigerd

      # Let's Encrypt
      AUTO_LETS_ENCRYPT: "yes"
      EMAIL_LETS_ENCRYPT: "${LE_EMAIL:?zet LE_EMAIL=jouw@adres in een .env-bestand}"
      LETS_ENCRYPT_CHALLENGE: "http"
      USE_LETS_ENCRYPT_STAGING: "no"    # "yes" = testcertificaat (niet vertrouwd door browsers)

      # Reverse proxy: stuur alles door naar de app
      USE_REVERSE_PROXY: "yes"
      g01.ipv6.thelastgym.be_REVERSE_PROXY_URL: "/"
      g01.ipv6.thelastgym.be_REVERSE_PROXY_HOST: "http://app:8080"
      # Keycloak: enkel de paden die nodig zijn om in te loggen (zoals Keycloak aanraadt).
      # /auth/admin/ wordt NIET doorgestuurd: de admin console is niet publiek.
      g01.ipv6.thelastgym.be_REVERSE_PROXY_URL_1: "/auth/realms/"
      g01.ipv6.thelastgym.be_REVERSE_PROXY_HOST_1: "http://keycloak:8080"
      g01.ipv6.thelastgym.be_REVERSE_PROXY_URL_2: "/auth/resources/"
      g01.ipv6.thelastgym.be_REVERSE_PROXY_HOST_2: "http://keycloak:8080"
    restart: unless-stopped
    networks:
      - bw-universe

  # --- De app: geen "ports:" meer, enkel bereikbaar via de WAF -----------------
  app:
    build: ./app
    environment:
      ConnectionStrings__Unbreakable: "Host=db;Port=5432;Database=unbreakable;Username=unbreakable;Password=Unbr3akable!2026"
      # Tokens van Keycloak: issuer = de publieke URL, sleutels intern ophalen.
      Auth__Authority: "https://g01.ipv6.thelastgym.be/auth/realms/unbreakable"
      Auth__MetadataAddress: "http://keycloak:8080/auth/realms/unbreakable/.well-known/openid-configuration"
      Auth__Audience: "unbreakable-api"
      # De PDP: OpenFGA, enkel intern bereikbaar, met een preshared key.
      Fga__ApiUrl: "http://openfga:8080"
      Fga__ApiToken: "${FGA_API_TOKEN:?zet FGA_API_TOKEN in een .env-bestand}"
      Fga__StoreName: "unbreakable"
      Fga__ModelFile: "/app/openfga/model.json"
    volumes:
      # Het autorisatiemodel: de API laadt het op in OpenFGA, maar kan het niet wijzigen.
      - ./openfga/model.json:/app/openfga/model.json:ro
    depends_on:
      - db
      - keycloak
      - openfga
    restart: unless-stopped
    networks:
      - bw-services   # zodat de WAF de app ziet
      - backend       # zodat de app de database ziet
                      # (en via bw-services ook Keycloak, voor de publieke sleutels)
      - openfga       # zodat de app de PDP ziet

  # --- De database: enkel bereikbaar voor de app -------------------------------
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: unbreakable
      POSTGRES_USER: unbreakable
      POSTGRES_PASSWORD: Unbr3akable!2026
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

  # --- Identity provider: Keycloak (OIDC) -------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]   # productiemodus, niet start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_ADMIN_USER:?zet KC_ADMIN_USER in een .env-bestand}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:?zet KC_ADMIN_PASSWORD in een .env-bestand}"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-db:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:?zet KC_DB_PASSWORD in een .env-bestand}"
      # Publieke URL: dit wordt ook de issuer in elk token.
      KC_HOSTNAME: "https://g01.ipv6.thelastgym.be/auth"
      # Admin console enkel via de SSH-tunnel naar 127.0.0.1:8081.
      KC_HOSTNAME_ADMIN: "http://localhost:8081/auth"
      # De app mag de sleutels intern ophalen op http://keycloak:8080/auth/...
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HTTP_ENABLED: "true"            # TLS stopt bij BunkerWeb
      KC_PROXY_HEADERS: "xforwarded"
      KC_HEALTH_ENABLED: "true"
      # Java mag hoogstens 70% van de containerlimiet als heap gebruiken.
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50"

    volumes:
      # Realm + client worden bij de eerste start geimporteerd (bestaat de realm al, dan niet opnieuw).
      - ./keycloak/realm-unbreakable.json:/opt/keycloak/data/import/realm-unbreakable.json:ro
    ports:
      - "127.0.0.1:8081:8080"   # enkel lokaal op de server, niet van buitenaf
    depends_on:
      - keycloak-db
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - bw-services        # zodat de WAF en de app Keycloak zien
      - keycloak-backend   # zodat Keycloak zijn database ziet

  # --- De database van Keycloak: apart van die van de app ---------------------
  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD:?zet KC_DB_PASSWORD in een .env-bestand}"
    volumes:
      - keycloak-dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - keycloak-backend

  # --- PDP: OpenFGA (autorisatie) ---------------------------------------------
  # Enkel bereikbaar voor de app, op het interne netwerk "openfga". Geen ports:,
  # niet in bw-services: BunkerWeb en het internet kunnen er niet bij.
  openfga:
    image: openfga/openfga:v1.22.1
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: "postgres"
      OPENFGA_DATASTORE_URI: "postgres://openfga:${FGA_DB_PASSWORD:?zet FGA_DB_PASSWORD in een .env-bestand}@openfga-db:5432/openfga?sslmode=disable"
      # Ook intern moet wie OpenFGA aanspreekt deze sleutel meesturen.
      OPENFGA_AUTHN_METHOD: "preshared"
      OPENFGA_AUTHN_PRESHARED_KEYS: "${FGA_API_TOKEN:?zet FGA_API_TOKEN in een .env-bestand}"
      # De webinterface (playground) en de metrics staan standaard aan: niet nodig.
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_METRICS_ENABLED: "false"
      OPENFGA_LOG_FORMAT: "json"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    networks:
      - openfga           # zodat de app OpenFGA ziet
      - openfga-backend   # zodat OpenFGA zijn database ziet

  # Maakt eenmalig de tabellen aan in de databank van OpenFGA, en stopt dan.
  openfga-migrate:
    image: openfga/openfga:v1.22.1
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: "postgres"
      OPENFGA_DATASTORE_URI: "postgres://openfga:${FGA_DB_PASSWORD:?zet FGA_DB_PASSWORD in een .env-bestand}@openfga-db:5432/openfga?sslmode=disable"
    depends_on:
      openfga-db:
        condition: service_healthy
    restart: "no"
    networks:
      - openfga-backend

  # --- De database van OpenFGA: hier staan de tuples (de feiten) -------------
  # Zonder databank houdt OpenFGA alles in het geheugen, en is na een herstart elke
  # tuple weg: dan ziet niemand nog een bericht.
  openfga-db:
    image: postgres:17
    environment:
      POSTGRES_DB: openfga
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: "${FGA_DB_PASSWORD:?zet FGA_DB_PASSWORD in een .env-bestand}"
    volumes:
      - openfga-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - openfga-backend

volumes:
  dbdata:
  bw-storage:
  keycloak-dbdata:
  openfga-dbdata:

networks:
  bw-universe:
    name: bw-universe
    ipam:
      driver: default
      config:
        - subnet: 10.20.30.0/24
  bw-services:
    name: bw-services
  backend:
    name: backend
  keycloak-backend:
    name: keycloak-backend
  # internal: geen verbinding met het internet, enkel tussen de containers erop.
  openfga:
    name: openfga
    internal: true
  openfga-backend:
    name: openfga-backend
    internal: true
